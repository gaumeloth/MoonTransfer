[project]
name = "moontransfer"
version = "0.1.0"
description = "Cross-platform GUI for secure file transfers via croc"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "PySide6>=6.6",
]

[project.scripts]
moontransfer = "moontransfer.app:main"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pyinstaller>=6.0",
]

[tool.moontransfer.croc]
version = "10.7.0"

[tool.moontransfer.croc.hashes]
"croc_v10.7.0_Linux-64bit.tar.gz" = "sha256:58ac4e1cc6f47e5982d08936b6484456286bfbdb4bc47e13b6894674a5f1ddca"
"croc_v10.7.0_Linux-ARM64.tar.gz" = "sha256:1607e11c0a6304d6e88b201f015daa8a87d9d8696b4dd728c4e95c4fbd6f7f89"
"croc_v10.7.0_macOS-64bit.tar.gz" = "sha256:be8f34ab4e9666088fc29cc982cf18d22978fcd0fbf4a428fd2ac7be99af5943"
"croc_v10.7.0_macOS-ARM64.tar.gz" = "sha256:be7a6716068277002d2fc30a5c37c8786641b40226b412ace20b44aebacd594c"
"croc_v10.7.0_Windows-64bit.zip" = "sha256:0eb2755ce9e73c172ec306167f3274c11b6d96de10f71a13abc7c0a2db7cd26a"
"croc_v10.7.0_Windows-ARM64.zip" = "sha256:4ab2822fecfb3b4ec57ccab40b9c5546b5b214dbe05dd41242fe26a2ffb73d49"

[build-system]
