name: Build release artifacts

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v[0-9]*-alpha.*"
      - "v[0-9]*-beta.*"
      - "v[0-9]*-rc.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  UV_VERSION: "0.11.29"
  PYTHON_VERSION: "3.13"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: windows-x86_64
            runner: windows-2022
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Linux Qt runtime dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libegl1

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --frozen --dev

      - name: Run the test suite
        run: uv run --frozen --dev python -m unittest discover -s tests -v

      - name: Build the onedir bundle
        run: uv run --frozen --dev python tools/build.py

      - name: Determine the package version
        id: package-version
        shell: bash
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            project_version="$(uv version --short)"
            short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-12)"
            version="${project_version}-dev.${GITHUB_RUN_NUMBER}-${short_sha}"
          fi
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - name: Validate and package the bundle
        run: >-
          uv run --frozen --dev python tools/package_release.py
          --target "${{ matrix.target }}"
          --version "${{ steps.package-version.outputs.version }}"

      - name: Upload the testable release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: release/MoonTransfer-*-${{ matrix.target }}.*
          archive: false
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Create draft pre-release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write

    steps:
      - name: Validate the pre-release tag
        shell: bash
        run: |
          set -eu
          printf '%s\n' "${GITHUB_REF_NAME}" \
            | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$'

      - name: Download the packaged builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: MoonTransfer-*
          merge-multiple: true
          skip-decompress: true

      - name: Generate SHA-256 checksums
        shell: bash
        working-directory: release-assets
        run: sha256sum MoonTransfer-* > SHA256SUMS

      - name: Create or refresh the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            is_draft="$(
              gh release view "${GITHUB_REF_NAME}" \
                --json isDraft \
                --jq '.isDraft'
            )"
            if [ "${is_draft}" != "true" ]; then
              echo "Refusing to overwrite a published release." >&2
              exit 1
            fi
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --draft \
              --prerelease \
              --title "MoonTransfer ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              release-assets/*
          fi
