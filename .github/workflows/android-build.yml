name: Build Android artifact

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      signed_release:
        type: boolean
        default: false
      version_code:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      signed_release:
        description: Build a signed release APK (main only; requires android-signing environment)
        type: boolean
        default: false
      version_code:
        description: Optional manual versionCode override; blank uses android/release.toml
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  UV_VERSION: "0.11.29"
  PYTHON_VERSION: "3.13.14"
  JAVA_VERSION: "17"
  GO_VERSION: "1.25.12"
  RUST_VERSION: "1.97.1"

jobs:
  build:
    name: Build android-arm64 ${{ inputs.signed_release && 'unsigned release' || 'debug' }} APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.package-version.outputs.version }}
      version_code: ${{ steps.release-request.outputs.version_code }}
    env:
      SIGNED_RELEASE: ${{ inputs.signed_release == true }}
      VERSION_CODE: ${{ inputs.version_code }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.signed_release && '0' || '1' }}

      - name: Validate trusted release request and versionCode
        id: release-request
        if: env.SIGNED_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ "${GITHUB_REF}" = refs/heads/main ]; then
            :
          elif [ "${GITHUB_EVENT_NAME}" = push ] && [ "${GITHUB_REF_TYPE}" = tag ]; then
            python3 -m tools.release_assets validate-tag "${GITHUB_REF_NAME}"
            git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main
            test -z "${VERSION_CODE}"
          else
            echo 'Signing is allowed only for manual main builds or approved pre-release tags.' >&2
            exit 1
          fi
          args=()
          if [ -n "${VERSION_CODE}" ]; then
            args=(--override "${VERSION_CODE}")
          fi
          code="$(python3 -m tools.android release-version-code "${args[@]}")"
          printf 'version_code=%s\n' "${code}" >> "${GITHUB_OUTPUT}"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: android/uv.lock

      - name: Install Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Rust
        run: |
          rustup set profile minimal
          rustup toolchain install "${RUST_VERSION}" --no-self-update
          rustup default "${RUST_VERSION}"

      - name: Install Android host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            autoconf \
            automake \
            autopoint \
            build-essential \
            cmake \
            gettext \
            git \
            libegl1 \
            libffi-dev \
            libgl1 \
            libgl1-mesa-dri \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtinfo6 \
            libtool \
            pkg-config \
            unzip \
            zip \
            zlib1g-dev

      - name: Restore the Android SDK and NDK cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.buildozer/android/platform
          key: ${{ runner.os }}-buildozer-platform-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-platform-

      - name: Restore the Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-android-gradle-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-android-gradle-

      - name: Verify the Android dependency lock
        run: uv lock --check --project android

      - name: Install locked Android dependencies
        run: uv sync --project android --frozen --group build

      - name: Run Android unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: >-
          uv run --project android --frozen --group build
          python -m unittest discover -s tests -p 'test_android*.py' -v

      - name: Run Android GUI regression tests with software rendering
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/android/app
          MOONTRANSFER_KIVY_TOUCH_TESTS: "1"
          KIVY_NO_ARGS: "1"
          KIVY_NO_FILELOG: "1"
          SDL_VIDEODRIVER: offscreen
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >-
          uv run --project android --frozen --group build
          python -m unittest tests.test_android_header tests.test_android_sharing_ui
          tests.test_android_scroll -v

      - name: Check the Android build environment
        run: ./scripts/android.sh doctor

      - name: Determine the package version
        id: package-version
        shell: bash
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            project_version="$(uv version --short)"
            short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-12)"
            version="${project_version}-dev.${GITHUB_RUN_NUMBER}-${short_sha}"
          fi
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - name: Build the Android debug APK
        if: env.SIGNED_RELEASE != 'true'
        run: >-
          ./scripts/android.sh build
          --buildozer-profile ci
          --version "${{ steps.package-version.outputs.version }}"
          --commit "${{ github.sha }}"

      - name: Validate and stage the Android debug APK
        if: env.SIGNED_RELEASE != 'true'
        run: >-
          ./scripts/android.sh package
          --version "${{ steps.package-version.outputs.version }}"
          --commit "${{ github.sha }}"

      - name: Build and stage the unsigned release APK (no signing secrets)
        if: env.SIGNED_RELEASE == 'true'
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
          VERSION_CODE: ${{ steps.release-request.outputs.version_code }}
        run: |
          ./scripts/android.sh build --release-unsigned --buildozer-profile ci \
            --version-code "${VERSION_CODE}" --version "${PACKAGE_VERSION}" --commit "${GITHUB_SHA}"
          ./scripts/android.sh package --release-unsigned \
            --version "${PACKAGE_VERSION}" --commit "${GITHUB_SHA}"

      - name: Verify the Android manifest
        if: env.SIGNED_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk="release/MoonTransfer-${{ steps.package-version.outputs.version }}-android-arm64-debug.apk"
          aapt="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          if [ -z "${aapt}" ]; then
            echo "Unable to locate aapt in the Android SDK." >&2
            exit 1
          fi

          badging="$("${aapt}" dump badging "${apk}")"
          printf '%s\n' "${badging}"
          grep -Fq "package: name='io.github.gaumeloth.moontransfer' versionCode='1' versionName='${{ steps.package-version.outputs.version }}'" <<<"${badging}"
          grep -Fq "compileSdkVersion='36'" <<<"${badging}"
          grep -Fxq "sdkVersion:'24'" <<<"${badging}"
          grep -Fxq "targetSdkVersion:'36'" <<<"${badging}"
          grep -Fxq "application-debuggable" <<<"${badging}"
          grep -Fxq "native-code: 'arm64-v8a'" <<<"${badging}"

          apkanalyzer="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name apkanalyzer -print | sort -V | tail -n 1)"
          if [ -z "${apkanalyzer}" ]; then
            echo "Unable to locate apkanalyzer in the Android SDK." >&2
            exit 1
          fi
          "${apkanalyzer}" manifest print "${apk}" |
            uv run --project android --frozen --group build python -m tools.android verify-share-manifest

      - name: Upload the testable Android artifact
        if: env.SIGNED_RELEASE != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: release/MoonTransfer-*-android-arm64-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release for the isolated signing job
        if: env.SIGNED_RELEASE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-unsigned
          path: release/MoonTransfer-*-android-arm64-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign android-arm64 release APK
    needs: build
    if: >-
      inputs.signed_release &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'push' && github.ref_type == 'tag'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: android-signing
    env:
      PACKAGE_VERSION: ${{ needs.build.outputs.version }}
      VERSION_CODE: ${{ needs.build.outputs.version_code }}
    steps:
      - name: Check out the trusted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download only this run's unsigned APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-release-unsigned
          path: unsigned

      - name: Sign and verify (no build or dependency installation)
        env:
          MOONTRANSFER_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MOONTRANSFER_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          MOONTRANSFER_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          CERTIFICATE_SHA256: ${{ vars.ANDROID_CERTIFICATE_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keydir="$(mktemp -d "${RUNNER_TEMP}/moontransfer-signing.XXXXXX")"
          trap 'rm -rf -- "${keydir}"' EXIT
          printf '%s' "${MOONTRANSFER_ANDROID_KEYSTORE_BASE64:?Missing keystore secret}" | base64 --decode > "${keydir}/release.p12"
          unset MOONTRANSFER_ANDROID_KEYSTORE_BASE64
          python3 -m tools.android_signing sign \
            --apk "unsigned/MoonTransfer-${PACKAGE_VERSION}-android-arm64-release-unsigned.apk" \
            --output "signed/MoonTransfer-${PACKAGE_VERSION}-android-arm64.apk" \
            --keystore "${keydir}/release.p12" \
            --alias "${KEY_ALIAS:?Missing alias variable}" \
            --expected-sha256 "${CERTIFICATE_SHA256:?Missing certificate fingerprint variable}" \
            --version "${PACKAGE_VERSION}" --commit "${GITHUB_SHA}" --version-code "${VERSION_CODE}"
          (cd signed && sha256sum "MoonTransfer-${PACKAGE_VERSION}-android-arm64.apk" > SHA256SUMS)

      - name: Upload the signed APK (not a GitHub Release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: signed/MoonTransfer-*-android-arm64.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: signed/SHA256SUMS
          archive: false
          if-no-files-found: error
          retention-days: 14
